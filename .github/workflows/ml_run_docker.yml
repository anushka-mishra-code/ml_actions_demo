name: Custom Docker ML Run

on:
  push:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t custom-ml-image .

      - name: Run ML Script in Custom Docker Container
        run: |
          docker run custom-ml-image